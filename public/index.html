    <!-- Prevent flash of unstyled content for dark mode -->
    <script>
      // Immediately set dark mode class based on saved preference or system preference
      (function() {
        var savedTheme = localStorage.getItem('theme');
        var isDarkMode = savedTheme === 'dark' || 
                         (!savedTheme && window.matchMedia && 
                          window.matchMedia('(prefers-color-scheme: dark)').matches);
        
        if (isDarkMode) {
          document.documentElement.classList.add('dark-mode');
        } else {
          document.documentElement.classList.add('light-mode');
        }
        
        // Add transition disable class to prevent flash
        document.documentElement.classList.add('dark-mode-transition-disable');
        
        // Remove transition disable after page loads
        window.addEventListener('DOMContentLoaded', function() {
          setTimeout(function() {
            document.documentElement.classList.remove('dark-mode-transition-disable');
          }, 100);
        });
      })();
    </script>
    
    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script checks to see if a redirect is present in the query string,
      // converts it back into the correct url and adds it to the
      // browser's history using window.history.replaceState(...)
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
